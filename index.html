<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الحضور</title>
<style>
  * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
  body {
    margin: 0;
    min-height: 100vh;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .container {
    background: #fff;
    width: 100%;
    max-width: 480px;
    border-radius: 18px;
    padding: 30px 25px;
    box-shadow: 0 20px 45px rgba(0,0,0,0.3);
  }
  h1 {
    text-align: center;
    color: #1e3c72;
    margin: 0 0 25px;
    font-size: 24px;
  }
  .field { margin-bottom: 18px; }
  label {
    display: block;
    margin-bottom: 7px;
    color: #333;
    font-weight: 600;
    font-size: 14px;
  }
  input[type="text"] {
    width: 100%;
    padding: 12px 14px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 15px;
    transition: .3s;
    outline: none;
  }
  input[type="text"]:focus {
    border-color: #2a5298;
    box-shadow: 0 0 0 4px rgba(42,82,152,0.1);
  }
  input.invalid { border-color: #ff4757; background: #fff5f5; }
  .hint { font-size: 12px; color: #888; margin-top: 5px; }
  .signature-wrap {
    border: 2px dashed #bbb;
    border-radius: 10px;
    background: #fafafa;
    position: relative;
    overflow: hidden;
  }
  canvas {
    width: 100%;
    height: 160px;
    display: block;
    cursor: crosshair;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
  }
  .clear-btn {
    position: absolute;
    top: 8px;
    left: 8px;
    background: #ff4757;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 5px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .submit-btn {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    transition: .3s;
  }
  .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(30,60,114,0.4); }
  .submit-btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }
  .msg {
    margin-top: 15px;
    padding: 12px;
    border-radius: 8px;
    text-align: center;
    font-weight: 600;
    display: none;
  }
  .msg.success { background: #d4edda; color: #155724; display: block; }
  .msg.error { background: #f8d7da; color: #721c24; display: block; }

  /* ====== النافذة المنبثقة (Modal) ====== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 25, 50, 0.6);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 9999;
  }
  .modal-overlay.show { display: flex; }

  .modal-box {
    background: #fff;
    border-radius: 18px;
    padding: 30px 28px;
    width: 100%;
    max-width: 320px;
    text-align: center;
    box-shadow: 0 25px 60px rgba(0,0,0,0.45);
    animation: popIn .25s cubic-bezier(.2,.8,.4,1.2);
  }
  @keyframes popIn {
    from { transform: scale(.85); opacity: 0; }
    to   { transform: scale(1);   opacity: 1; }
  }

  .spinner {
    width: 52px;
    height: 52px;
    margin: 0 auto 18px;
    border: 5px solid #e3e8f0;
    border-top-color: #2a5298;
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .modal-icon {
    font-size: 52px;
    line-height: 1;
    margin-bottom: 14px;
    display: none;
    animation: popIn .3s ease;
  }

  .modal-text {
    color: #1e3c72;
    font-weight: 700;
    font-size: 17px;
  }
  .modal-text.error { color: #c0392b; }

  .modal-sub {
    color: #777;
    font-size: 13px;
    margin-top: 8px;
    min-height: 18px;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>📋 تسجيل الحضور</h1>

    <form id="attendanceForm" autocomplete="off" novalidate>
      <div class="field">
        <label>الرقم</label>
        <input type="text" id="number" required inputmode="numeric"
             maxlength="8" placeholder="أدخل 8 أرقام">
        <div class="hint">يجب أن يتكوّن من 8 أرقام بالضبط</div>
      </div>

      <div class="field">
        <label>الاسم</label>
        <input type="text" id="name" required maxlength="60"
               placeholder="أدخل الاسم الكامل">
      </div>

      <div class="field">
        <label>جهة العمل</label>
        <input type="text" id="department" required maxlength="60"
               placeholder="أدخل جهة العمل / القسم">
      </div>

      <div class="field">
        <label>التوقيع (ارسم بإصبعك أو الماوس)</label>
        <div class="signature-wrap">
          <canvas id="signature"></canvas>
          <button type="button" class="clear-btn" onclick="clearSignature()">مسح</button>
        </div>
      </div>

      <button type="submit" class="submit-btn" id="submitBtn">تسجيل الحضور</button>
      <div id="msg" class="msg"></div>
    </form>
  </div>

  <!-- ====== نافذة "جارٍ الإرسال" المنبثقة ====== -->
  <div class="modal-overlay" id="modal">
    <div class="modal-box">
      <div class="spinner" id="modalSpinner"></div>
      <div class="modal-icon" id="modalIcon"></div>
      <div class="modal-text" id="modalText">جارٍ الإرسال...</div>
      <div class="modal-sub" id="modalSub">يرجى الانتظار قليلاً</div>
    </div>
  </div>

<script>
/* ====== ضع رابط Google Apps Script هنا ====== */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxv1gtriXQu2BpWC4eDWjPI9sO8fxfy9XOPK-_z9wTIEGYpwOoKoGunlA6Ht_Dggck/exec";

/* ============================================================
   1) التحقق من الحقول
   ============================================================ */
const numberInput = document.getElementById('number');
const nameInput   = document.getElementById('name');
const deptInput   = document.getElementById('department');

const ARABIC_DIGITS = /[\u0660-\u0669\u06F0-\u06F9]/;   // ٠-٩ و ۰-۹

/* حقل الرقم: أرقام فقط، 9 خانات كحد أقصى */
numberInput.addEventListener('input', () => {
numberInput.value = numberInput.value.replace(/[^0-9]/g, '').slice(0, 8);
  numberInput.classList.remove('invalid');
});

/* حقول النص: منع الأرقام تمامًا (عربية وإنجليزية) */
function restrictToText(el) {
  el.addEventListener('input', () => {
    el.value = el.value
      .replace(/[0-9]/g, '')
      .replace(ARABIC_DIGITS, '');
    el.classList.remove('invalid');
  });
  // منع لصق نص يحتوي أرقام
  el.addEventListener('paste', (e) => {
    const txt = (e.clipboardData || window.clipboardData).getData('text');
    if (/[0-9]/.test(txt) || ARABIC_DIGITS.test(txt)) {
      e.preventDefault();
      const clean = txt.replace(/[0-9]/g, '').replace(ARABIC_DIGITS, '');
      document.execCommand('insertText', false, clean);
    }
  });
}
restrictToText(nameInput);
restrictToText(deptInput);

/* التحقق النهائي */
function isValidNumber(v) {
return /^[0-9]{8}$/.test(v);
}
function isValidText(v) {
  if (v.length < 2) return false;
  if (/[0-9]/.test(v) || ARABIC_DIGITS.test(v)) return false;
  // يجب أن يحتوي على حرف واحد على الأقل
  return /[\p{L}]/u.test(v);
}

/* ============================================================
   2) لوحة التوقيع
   ============================================================ */
const canvas = document.getElementById('signature');
const ctx = canvas.getContext('2d');
let drawing = false;
let hasSignature = false;
let lastPoint = null;

function setupCanvas() {
  const ratio = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const w = Math.max(rect.width, 1);
  const h = Math.max(rect.height, 1);

  canvas.width  = Math.round(w * ratio);
  canvas.height = Math.round(h * ratio);

  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  ctx.strokeStyle = '#111111';

  ctx.fillStyle = '#fafafa';
  ctx.fillRect(0, 0, w, h);
}

function getPos(e) {
  const rect = canvas.getBoundingClientRect();
  const p = (e.touches && e.touches.length) ? e.touches[0] : e;
  return { x: p.clientX - rect.left, y: p.clientY - rect.top };
}

function start(e) {
  e.preventDefault();
  drawing = true;
  lastPoint = getPos(e);
}
function move(e) {
  if (!drawing) return;
  e.preventDefault();
  const p = getPos(e);
  if (lastPoint) {
    ctx.beginPath();
    ctx.moveTo(lastPoint.x, lastPoint.y);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    hasSignature = true;
  }
  lastPoint = p;
}
function end() {
  drawing = false;
  lastPoint = null;
}

canvas.addEventListener('mousedown', start);
canvas.addEventListener('mousemove', move);
canvas.addEventListener('mouseup', end);
canvas.addEventListener('mouseleave', end);
canvas.addEventListener('touchstart', start, { passive: false });
canvas.addEventListener('touchmove', move,  { passive: false });
canvas.addEventListener('touchend', end);
canvas.addEventListener('touchcancel', end);

function clearSignature() {
  const ratio = window.devicePixelRatio || 1;
  const w = canvas.width / ratio;
  const h = canvas.height / ratio;
  ctx.fillStyle = '#fafafa';
  ctx.fillRect(0, 0, w, h);
  hasSignature = false;
  lastPoint = null;
}

window.addEventListener('orientationchange', () => {
  setTimeout(() => { setupCanvas(); hasSignature = false; }, 350);
});

/* تصغير التوقيع قبل الإرسال (يمنع فشل الطلب على الجوال) */
function getSignatureBase64() {
  const MAX_WIDTH = 500;
  const srcW = canvas.width, srcH = canvas.height;
  if (!srcW || !srcH) return '';

  const scale = Math.min(1, MAX_WIDTH / srcW);
  const outW = Math.max(1, Math.round(srcW * scale));
  const outH = Math.max(1, Math.round(srcH * scale));

  const tmp = document.createElement('canvas');
  tmp.width = outW;
  tmp.height = outH;
  const tctx = tmp.getContext('2d');
  tctx.fillStyle = '#ffffff';
  tctx.fillRect(0, 0, outW, outH);
  tctx.drawImage(canvas, 0, 0, outW, outH);

  return (tmp.toDataURL('image/jpeg', 0.7).split(',')[1]) || '';
}

/* ============================================================
   3) النافذة المنبثقة
   ============================================================ */
const modal        = document.getElementById('modal');
const modalSpinner = document.getElementById('modalSpinner');
const modalIcon    = document.getElementById('modalIcon');
const modalText    = document.getElementById('modalText');
const modalSub     = document.getElementById('modalSub');
let modalTimer = null;

function showSendingModal() {
  clearTimeout(modalTimer);
  modalSpinner.style.display = 'block';
  modalIcon.style.display    = 'none';
  modalText.classList.remove('error');
  modalText.textContent = 'جارٍ الإرسال...';
  modalSub.textContent  = 'يرجى الانتظار قليلاً';
  modal.classList.add('show');
}

function showResultModal(ok, title, subtitle, delay) {
  clearTimeout(modalTimer);
  modalSpinner.style.display = 'none';
  modalIcon.style.display    = 'block';
  modalIcon.textContent      = ok ? '✅' : '❌';
  modalText.textContent      = title;
  modalText.classList.toggle('error', !ok);
  modalSub.textContent       = subtitle || '';
  modal.classList.add('show');

  modalTimer = setTimeout(() => modal.classList.remove('show'), delay || (ok ? 1800 : 2600));
}

function hideModal() {
  clearTimeout(modalTimer);
  modal.classList.remove('show');
}

/* ============================================================
   4) إرسال النموذج
   ============================================================ */
const form = document.getElementById('attendanceForm');
const msg  = document.getElementById('msg');
const btn  = document.getElementById('submitBtn');
let sending = false;

function showFieldError(text, el) {
  msg.textContent = text;
  msg.className = 'msg error';
  if (el) {
    el.classList.add('invalid');
    el.focus();
    setTimeout(() => el.classList.remove('invalid'), 2500);
  }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  if (sending) return;

  msg.className = 'msg';

  const number     = numberInput.value.trim();
  const name       = nameInput.value.trim();
  const department = deptInput.value.trim();

  /* --- التحقق --- */
  if (!isValidNumber(number)) {
showFieldError('⚠️ الرقم يجب أن يكون 8 أرقام بالضبط', numberInput);
    return;
  }
  if (!isValidText(name)) {
    showFieldError('⚠️ الاسم يجب أن يحتوي على نص فقط (بدون أرقام)', nameInput);
    return;
  }
  if (!isValidText(department)) {
    showFieldError('⚠️ جهة العمل يجب أن تحتوي على نص فقط (بدون أرقام)', deptInput);
    return;
  }
  if (!hasSignature) {
    showFieldError('⚠️ يرجى إضافة التوقيع أولاً');
    return;
  }

  const signatureBase64 = getSignatureBase64();
  if (!signatureBase64) {
    showFieldError('⚠️ تعذّر قراءة التوقيع، أعد المحاولة');
    return;
  }

  /* --- الإرسال --- */
  sending = true;
  btn.disabled = true;
  showSendingModal();

  const params = new URLSearchParams();
  params.append('number', number);
  params.append('name', name);
  params.append('department', department);
  params.append('signature', signatureBase64);
  params.append('mime', 'image/jpeg');

  let ok = false;
  const startedAt = Date.now();

  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      body: params
    });
    ok = true;
  } catch (err) {
    console.error('fetch فشل:', err);
    if (navigator.sendBeacon) {
      try { ok = navigator.sendBeacon(SCRIPT_URL, params); }
      catch (e2) { console.error('beacon فشل:', e2); }
    }
  }

  /* إبقاء النافذة ظاهرة مدة كافية حتى لا تومض */
  const MIN_MS = 800;
  const elapsed = Date.now() - startedAt;
  if (elapsed < MIN_MS) {
    await new Promise(r => setTimeout(r, MIN_MS - elapsed));
  }

  if (ok) {
    showResultModal(true, 'تم تسجيل الحضور بنجاح', 'شكراً لك', 1600);

    form.reset();
    clearSignature();

    msg.textContent = '✅ تم تسجيل الحضور بنجاح';
    msg.className = 'msg success';
    setTimeout(() => { msg.className = 'msg'; }, 4000);
  } else {
    showResultModal(false, 'فشل الإرسال', 'تأكد من الاتصال بالإنترنت وحاول مجدداً', 2600);

    msg.textContent = '❌ فشل الإرسال، حاول مرة أخرى';
    msg.className = 'msg error';
  }

  sending = false;
  btn.disabled = false;
});

/* التهيئة */
window.addEventListener('load', setupCanvas);
setupCanvas();
</script>
</body>
</html>
