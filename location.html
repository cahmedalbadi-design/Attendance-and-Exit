<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>تحديد الموقع وإرساله إلى Google Sheets</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; padding: 20px; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { max-width: 800px; width: 100%; background: white; border-radius: 28px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; }
        .header { background: #1a73e8; color: white; padding: 20px; text-align: center; }
        .content { padding: 20px; }
        .map-container { height: 400px; width: 100%; border-radius: 20px; overflow: hidden; margin-bottom: 20px; border: 1px solid #ddd; }
        #map { height: 100%; width: 100%; }
        .info { background: #e8f0fe; padding: 15px; border-radius: 16px; margin-bottom: 20px; font-size: 14px; }
        button { background: #1a73e8; color: white; border: none; padding: 12px 24px; border-radius: 40px; font-size: 16px; cursor: pointer; width: 100%; margin-bottom: 10px; transition: 0.2s; }
        button:hover { background: #0d5bba; transform: scale(0.98); }
        #status { padding: 12px; border-radius: 12px; text-align: center; margin-top: 10px; font-size: 14px; }
        .loading { background: #fff3cd; color: #856404; }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .coord { font-family: monospace; background: #f1f3f4; padding: 8px; border-radius: 8px; margin: 8px 0; text-align: center; }
        footer { text-align: center; font-size: 12px; color: #5f6368; padding: 16px; border-top: 1px solid #eee; }
    </style>
    <!-- Leaflet CSS & JS for interactive map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
<div class="container">
    <div class="header">
        <h2>📍 تحديد موقعي الجغرافي</h2>
        <p>سيتم إرسال الموقع تلقائياً إلى Google Sheets</p>
    </div>
    <div class="content">
        <div class="map-container">
            <div id="map"></div>
        </div>
        
        <div class="info">
            <div style="font-weight:bold;">📌 موقعك الحالي:</div>
            <div id="coordsDisplay" class="coord">لم يتم التحديد بعد</div>
            <div id="accuracyDisplay"></div>
        </div>
        
        <button id="locateBtn">🎯 تحديث موقعي وإرساله</button>
        <button id="sendLastBtn" style="background:#34a853;">📤 إرسال آخر موقع تم تحديده</button>
        
        <div id="status"></div>
    </div>
    <footer>
        عند الضغط على زر التحديث، سيتم طلب إذن الوصول إلى الموقع. سيتم تخزين الإحداثيات وإرسالها إلى جدول البيانات.
    </footer>
</div>

<script>
    // ⚠️⚠️⚠️ مهم جداً: استبدل هذا الرابط بالرابط الذي حصلت عليه من Google Apps Script ⚠️⚠️⚠️
    const WEBAPP_URL = "https://script.google.com/macros/s/https://script.google.com/macros/s/AKfycbw1dT7ynWq_5VNIduDnNoW_JXy4XBiFEKUwXxeokpzF4eg5klakNhE41KUD9sll_gs4/exec/exec";
    
    let currentPosition = null;
    let map = null;
    let marker = null;
    
    // تهيئة الخريطة
    function initMap(lat, lng) {
        if (map === null) {
            map = L.map('map').setView([lat, lng], 15);
            L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> & CartoDB'
            }).addTo(map);
        } else {
            map.setView([lat, lng], 15);
        }
        
        if (marker) map.removeLayer(marker);
        marker = L.marker([lat, lng]).addTo(map)
            .bindPopup('📍 موقعك الحالي').openPopup();
        
        if (currentPosition && currentPosition.accuracy) {
            L.circle([lat, lng], { 
                radius: currentPosition.accuracy, 
                color: '#1a73e8', 
                fillColor: '#4285f4', 
                fillOpacity: 0.2 
            }).addTo(map);
            marker.bindPopup(`📍 موقعك<br>الدقة: ±${Math.round(currentPosition.accuracy)} متر`);
        }
    }
    
    function updateUI(position) {
        const lat = position.coords.latitude;
        const lng = position.coords.longitude;
        const acc = position.coords.accuracy;
        document.getElementById('coordsDisplay').innerHTML = `خط العرض: ${lat.toFixed(6)}<br>خط الطول: ${lng.toFixed(6)}`;
        document.getElementById('accuracyDisplay').innerHTML = `📏 دقة الموقع: ±${Math.round(acc)} متر`;
        initMap(lat, lng);
    }
    
    async function sendToSheet(position) {
        if (!position) {
            showStatus("⚠️ لا يوجد موقع تم تحديثه. اضغط أولاً على 'تحديث موقعي'", "error");
            return false;
        }
        
        const data = {
            lat: position.coords.latitude,
            lng: position.coords.longitude,
            accuracy: position.coords.accuracy,
            url: window.location.href
        };
        
        showStatus("⏳ جاري إرسال الموقع إلى جدول البيانات...", "loading");
        
        try {
            const response = await fetch(WEBAPP_URL, {
                method: 'POST',
                mode: 'cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            
            const result = await response.json();
            if (result.result === "success") {
                showStatus(`✅ تم إرسال الموقع بنجاح! رقم الصف: ${result.row}`, "success");
                return true;
            } else {
                throw new Error(result.error);
            }
        } catch (error) {
            console.error(error);
            showStatus("❌ فشل الإرسال: " + error.message, "error");
            return false;
        }
    }
    
    function showStatus(msg, type) {
        const statusDiv = document.getElementById('status');
        statusDiv.textContent = msg;
        statusDiv.className = type;
        setTimeout(() => {
            if (statusDiv.className === type) 
                statusDiv.className = '';
        }, 5000);
    }
    
    function getLocationAndSend() {
        if (!navigator.geolocation) {
            showStatus("المتصفح لا يدعم تحديد الموقع", "error");
            return;
        }
        
        showStatus("🔄 جاري تحديد موقعك... يرجى السماح بالوصول إلى الموقع.", "loading");
        
        navigator.geolocation.getCurrentPosition(
            async (pos) => {
                currentPosition = pos;
                updateUI(pos);
                showStatus("✅ تم تحديد موقعك! جاري الإرسال الآن...", "success");
                await sendToSheet(pos);
            },
            (err) => {
                let msg = "";
                switch(err.code) {
                    case err.PERMISSION_DENIED: msg = "تم رفض إذن الموقع. يرجى السماح في المتصفح."; break;
                    case err.POSITION_UNAVAILABLE: msg = "معلومات الموقع غير متاحة."; break;
                    case err.TIMEOUT: msg = "انتهى وقت محاولة تحديد الموقع."; break;
                    default: msg = "خطأ غير معروف.";
                }
                showStatus("❌ " + msg, "error");
            },
            { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
        );
    }
    
    // ربط الأزرار
    document.getElementById('locateBtn').addEventListener('click', () => {
        getLocationAndSend();
    });
    
    document.getElementById('sendLastBtn').addEventListener('click', () => {
        if (currentPosition) {
            sendToSheet(currentPosition);
        } else {
            showStatus("⚠️ لم يتم تحديد موقع بعد. اضغط على 'تحديث موقعي وإرساله' أولاً.", "error");
        }
    });
    
    // تحميل الخريطة الافتراضية
    window.addEventListener('load', () => {
        map = L.map('map').setView([24.7136, 46.6753], 5); // موقع الرياض كبداية
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: 'Map data &copy; OpenStreetMap'
        }).addTo(map);
        showStatus("🔘 اضغط على 'تحديث موقعي وإرساله' لمشاركة موقعك", "loading");
    });
</script>
</body>
</html>
